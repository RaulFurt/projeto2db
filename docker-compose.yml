# Sobe o PostgreSQL já com as tabelas e os dados de exemplo.
#   docker compose up -d
# Na primeira inicialização o Postgres executa, em ordem, os scripts de ./sql
# montados em /docker-entrypoint-initdb.d (01_schema.sql e 02_povoamento.sql).
services:
  db:
    image: postgres:16
    container_name: patrimonio-db
    environment:
      POSTGRES_DB: patrimonio
      POSTGRES_USER: patrimonio
      POSTGRES_PASSWORD: patrimonio
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_povoamento.sql:/docker-entrypoint-initdb.d/02_povoamento.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patrimonio -d patrimonio"]
      interval: 3s
      retries: 20

volumes:
  pgdata:
